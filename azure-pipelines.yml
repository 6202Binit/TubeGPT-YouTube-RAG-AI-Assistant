# Runs build-only for PRs to dev / prod (no push)
# Runs buildAndPush after merge to dev / prod with correct tags
trigger:
  branches:
    include:
    - dev
    - prod

pr:
  branches:
    include:
    - dev
    - prod
  drafts: false

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '37b60367-a8fd-47cc-9162-99454f77f059'
  imageRepository: 'ai/ecn-ser-ai-b2c'
  containerRegistry: 'onefinnet.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build / Push (push only after merge)
  jobs:
  - job: BuildAndMaybePush
    displayName: Build and conditionally push
    pool:
      vmImage: $(vmImageName)
    steps:
      # ---------- PR VALIDATION: build only (no push) ----------
      - task: Docker@2
        displayName: Build image (PRs only; no push)
        condition: eq(variables['Build.Reason'], 'PullRequest')
        inputs:
          command: build
          repository: $(imageRepository)
          dockerfile: $(dockerfilePath)
          tags: |
            $(Build.BuildId)

      # ---------- MERGE TO prod: build AND push with :BuildId and :prod ----------
      - task: Docker@2
        displayName: Build & Push (prod)
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/prod'))
        inputs:
          command: buildAndPush
          repository: $(imageRepository)
          dockerfile: $(dockerfilePath)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(Build.BuildId)
            prod

      # ---------- MERGE TO dev: build AND push with :BuildId and :dev ----------
      - task: Docker@2
        displayName: Build & Push (dev)
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
        inputs:
          command: buildAndPush
          repository: $(imageRepository)
          dockerfile: $(dockerfilePath)
          containerRegistry: $(dockerRegistryServiceConnection)
          tags: |
            $(Build.BuildId)
            dev